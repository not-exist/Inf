name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: quick runs the shortest gate set (Linux + windows-2025 compile).
        required: false
        type: choice
        default: full
        options:
          - full
          - quick

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

  lint:
    name: Lint
    needs: validate
    uses: ./.github/workflows/_lint.yml

  format:
    name: Format
    needs: validate
    uses: ./.github/workflows/_format.yml

  jdk:
    name: JDK matrix
    needs: [validate, format]
    uses: ./.github/workflows/_jdkmatrix.yml
    with:
      distributions: ${{ github.event.inputs.scope == 'quick' && '["temurin","corretto"]' || '["temurin","oracle-openjdk","corretto","zulu","oracle"]' }}

  build:
    name: Build
    needs: [validate, format, lint]
    uses: ./.github/workflows/_build.yml
    with:
      scope: ${{ github.event.inputs.scope || 'full' }}

  test:
    name: Test
    needs: jdk
    uses: ./.github/workflows/_test.yml
    with:
      scope: ${{ github.event.inputs.scope || 'full' }}

  gui:
    name: GUI
    needs: build
    uses: ./.github/workflows/_gui.yml
    with:
      scope: ${{ github.event.inputs.scope || 'full' }}

  # A single check that says "the pipeline is green". Everything it depends on has
  # already reported individually; this exists so branch protection needs one entry
  # instead of one per platform per stage.
  gate:
    name: Gate
    needs: [test, gui]
    uses: ./.github/workflows/_gate.yml

  package:
    name: Package
    needs: gate
    # _package.yml attests build provenance, and a called workflow can never hold more
    # permission than its caller: without these the whole run fails at startup.
    permissions:
      contents: read
      id-token: write # mint the OIDC token for build provenance
      attestations: write # publish the provenance attestation
    uses: ./.github/workflows/_package.yml
