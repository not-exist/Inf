name: Package

on:
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload the built jar as a workflow artifact.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  jar:
    name: Jar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-setup
        with:
          neoform-cache-key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Assemble and verify the jar
        run: ./gradlew --no-daemon --stacktrace --console=plain jar verifyJar checksums

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: build/libs/inf-*.jar

      - name: Upload jar
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: inf-${{ github.sha }}
          path: |
            build/libs/inf-*.jar
            build/libs/SHA256SUMS.txt
            build/reports/jar-verification/jar.txt
          if-no-files-found: error
          retention-days: 14

  # The jar is built on four operating systems; identical inputs must produce
  # identical bytes. Any platform-dependent input (timestamps, file order,
  # locale, line endings) shows up here as a hash mismatch.
  reproducible:
    name: Reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-setup
        with:
          neoform-cache-key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Build and record the hash
        run: ./gradlew --no-daemon --stacktrace --console=plain jar checksums

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare digests
    needs: reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          path: digests

      - name: All operating systems must agree on the SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find digests -name SHA256SUMS.txt -print -exec cat {} \;
          unique=$(find digests -name SHA256SUMS.txt -exec awk '{print $1}' {} \; | sort -u | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo "::error::The jar is not reproducible across operating systems."
            exit 1
          fi
          echo "Reproducible: all platforms produced the same digest."