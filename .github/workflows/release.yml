name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release run per tag, and never cancel one in flight: killing a run between
# "create draft" and "upload assets" leaves a half-published release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build jar
    permissions:
      contents: read
      id-token: write # forwarded to package.yml for the provenance attestation
      attestations: write # forwarded so the callee can publish that attestation
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Tag must match mod_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match mod_version v$VERSION"
            exit 1
          }
      # gh is preinstalled on the runner, so the release does not need a third-party
      # action in the supply chain. draft + --generate-notes matches what the action did.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/inf-*.jar dist/SHA256SUMS.txt
