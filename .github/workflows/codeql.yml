name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/gradle-setup
        with:
          neoform-cache-key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'java-kotlin'
        name: Compile for extraction
        # Extract from every source set: test, GameTest and client-test code is code
        # that can carry an injection or a resource leak just as main code can.
        run: >
          ./gradlew --no-daemon --stacktrace --console=plain
          compileJava compileTestJava compileGametestJava compileClienttestJava
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: /language:${{ matrix.language }}
