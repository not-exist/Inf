plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.12.0'
    id 'net.ltgt.errorprone' version '5.2.0'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// GameTests and the client GUI harness live in their own source sets so that they
// never ship in the release jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    clienttest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.103.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '.gitattributes', '.editorconfig'
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'json', {
        target 'src/**/*.json'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches the client with the GUI harness on the classpath. The harness
        // drives a real forge interaction; tools/gui_driver injects the input.
        clientTest {
            client()
            sourceSet = sourceSets.clienttest
            systemProperty 'inf.clienttest', 'true'
            systemProperty 'inf.clienttest.scenario', System.getProperty('inf.clienttest.scenario', 'default')
            // Fresh, small, quiet window: the driver needs a deterministic layout.
            programArguments.addAll '--width', '1280', '--height', '800'
            jvmArgument '-Dfml.queryResult=confirm'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Give the isolated GameTest, client-test and test source sets the
    // Minecraft/NeoForge classpath.
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.clienttest
    addModdingDependenciesTo sourceSets.test

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
            sourceSet(sourceSets.clienttest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // ErrorProne ships as javac plugin jars. The plugin's own 'errorprone'
    // configuration is declarative, so a resolvable child is needed to put the
    // jars on the processor path without fighting ModDevGradle's classpath.
    errorproneJars {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom errorprone
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation

    // Lint only our own sources. Minecraft and the generated patches contain
    // warnings we cannot fix and must not fail on.
    def ownSources = source.filter {
        def path = it.path.replace('\\', '/')
        path.contains('/src/main/java/') || path.contains('/src/test/java/') || path.contains('/src/gametest/java/')
    }
    if (!ownSources.isEmpty()) {
        options.compilerArgs << '-Xlint:all,-processing,-serial,-this-escape'
        // -Werror only on main: the test and GameTest source sets still call APIs that
        // 1.21.1 deprecates for removal (GameTestHelper#makeMockServerPlayerInLevel) and
        // have no replacement yet, so treating those as errors would block upgrades.
        if (project.hasProperty('warningsAsErrors') && name == 'compileJava') {
            options.compilerArgs << '-Werror'
        }
    }
}

// ErrorProne runs as a javac plugin and needs its own forked compiler; the
// analysis is skipped for non-main source sets because the modding classpath
// makes those compilations several times slower for no extra signal.
dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.53.0'
}

tasks.named('compileJava', JavaCompile).configure {
    // ErrorProne instruments the javac AST, so it must run in a forked compiler.
    options.fork = true
    // ModDevGradle owns the annotation processor path for the modding classpath, so
    // the plugin's default path never reaches javac. Append the ErrorProne jars.
    options.annotationProcessorPath = files(
            configurations.errorproneJars,
            options.annotationProcessorPath)
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // Silence checks that fight NeoForge's API shape; every entry needs a reason.
        disable('InlineMeSuggester')
        disable('NonCanonicalType')
    }
}

// ErrorProne is scoped to main sources on purpose: the GameTest and test source sets
// pull the whole modding classpath in and an analysis there costs minutes for no
// additional signal. The plugin still needs the opt-out made explicit.
['compileTestJava', 'compileGametestJava'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        options.errorprone.enabled = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'com.inf.forge.ForgeMath',
                    'com.inf.forge.ForgeViewModel',
                    'com.inf.forge.HammerMath',
                    'com.inf.forge.ForgeTiming',
                    'com.inf.forge.WeaponSettlement',
                    'com.inf.weapon.WeaponStatsTable',
                    'com.inf.weapon.HarvestRules',
                    'com.inf.menu.ForgeMenuRules',
                    'com.inf.menu.ForgeMenuTransfer',
                    'com.inf.registry.FrenzyStateCodec',
                    'com.inf.tools.BalanceSimulator'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// The JDK vendor matrix is only meaningful if Gradle actually compiles with the
// JDK that the workflow installed. The foojay resolver would otherwise download a
// Temurin JDK whenever the requested toolchain is missing, and every vendor job
// would silently test Temurin. CI pins the installations path and this task then
// asserts that the resolved 21 toolchain has the expected vendor.
tasks.register('verifyToolchain') {
    description = 'Assert that the resolved Java 21 toolchain comes from -PexpectedJdkVendor.'
    group = 'verification'
    def expected = providers.gradleProperty('expectedJdkVendor')
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    doLast {
        if (!expected.isPresent()) {
            throw new GradleException('Pass -PexpectedJdkVendor=<substring of vendor name>')
        }
        def resolved = launcher.get()
        def metadata = resolved.metadata
        def vendor = metadata.vendor
        def want = expected.get()
        logger.lifecycle("toolchain: vendor='${vendor}' version=${metadata.languageVersion} home=${metadata.installationPath}")
        if (!vendor.toLowerCase().contains(want.toLowerCase())) {
            throw new GradleException(
                    "Expected a JDK whose vendor contains '${want}', but Gradle resolved '${vendor}'. " +
                    "Check that the workflow installed that distribution and pinned " +
                    "org.gradle.java.installations.paths.")
        }
    }
}

// ---------------------------------------------------------------------------
// CI helpers. All of them are Gradle tasks rather than shell snippets so that
// the same command works on Windows, macOS and Linux runners.
// ---------------------------------------------------------------------------

// The dev run directory is gitignored and absent on a fresh runner. GameTestServer
// and the server run both refuse to start without an accepted EULA.
tasks.register('prepareRunDir') {
    description = 'Create run/ and accept the Minecraft EULA for CI runs.'
    group = 'verification'
    def runDir = layout.projectDirectory.dir('run')
    outputs.upToDateWhen { false }
    doLast {
        def dir = runDir.asFile
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = [
                'online-mode=false',
                'level-type=minecraft\\:flat',
                'spawn-protection=0',
                'max-players=2',
                'view-distance=4',
                'simulation-distance=4'
        ].join('\n') + '\n'
    }
}

// The GUI test needs deterministic settings: no strike cooldown, no value animation,
// a fixed 1280x800 window at GUI scale 1 and a low render distance. Copying them in
// Gradle keeps the driver free of shell-specific file handling.
tasks.register('prepareClientTest') {
    description = 'Write the deterministic options and config used by the GUI test.'
    group = 'verification'
    def runDir = layout.projectDirectory.dir('run').asFile
    def sourceDir = layout.projectDirectory.dir('tools/gui_driver/run-config').asFile
    outputs.upToDateWhen { false }
    doLast {
        def configDir = new File(runDir, 'config')
        configDir.mkdirs()
        new File(runDir, 'clienttest').mkdirs()
        java.nio.file.Files.copy(
                new File(sourceDir, 'options.txt').toPath(),
                new File(runDir, 'options.txt').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(
                new File(sourceDir, 'inf-common.toml').toPath(),
                new File(configDir, 'inf-common.toml').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// A server run is only useful as a smoke test if it actually reached "Done" and
// logged no errors; grep and sed are not portable, so the assertions live here.
// Runs the dedicated server, waits for its ready line, then stops it. Doing this in
// Gradle instead of a shell script keeps one implementation for all three operating
// systems and fails on the server's own log rather than on a shell timeout utility
// that does not exist everywhere.
tasks.register('serverSmokeTest') {
    description = 'Start the dedicated server, wait for "Done (", then stop it.'
    group = 'verification'
    dependsOn tasks.named('prepareRunDir')
    // Everything the action needs is captured at configuration time: the configuration
    // cache forbids touching project state during execution.
    def runDir = layout.projectDirectory.dir('run').asFile
    def projectDir = layout.projectDirectory.asFile
    def timeoutSeconds = (findProperty('serverSmokeTimeoutSeconds') ?: '300') as int
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    def gradlew = new File(projectDir, isWindows ? 'gradlew.bat' : 'gradlew')
    doLast {
        def logFile = new File(runDir, 'logs/latest.log')
        logFile.delete()
        def consoleLog = new File(runDir, 'server-smoke.log')
        def process = new ProcessBuilder(
                gradlew.absolutePath, '--no-daemon', '--console=plain', 'runServer')
                .directory(projectDir)
                .redirectErrorStream(true)
                .redirectOutput(ProcessBuilder.Redirect.appendTo(consoleLog))
                .start()
        def deadline = System.currentTimeMillis() + timeoutSeconds * 1000L
        boolean ready = false
        try {
            while (System.currentTimeMillis() < deadline) {
                if (logFile.exists() && logFile.text.contains('Done (')) {
                    ready = true
                    break
                }
                if (!process.isAlive()) break
                Thread.sleep(1000)
            }
        } finally {
            process.destroy()
            process.waitFor()
        }
        if (!ready) {
            throw new GradleException(
                    "Server did not reach the ready state within ${timeoutSeconds}s; see run/server-smoke.log")
        }
        logger.lifecycle('serverSmokeTest: server reached the ready state')
    }
}

tasks.register('verifyServerLog') {
    description = 'Fail when run/logs/latest.log shows a failed server start.'
    group = 'verification'
    def logFile = layout.projectDirectory.file('run/logs/latest.log')
    doLast {
        def file = logFile.asFile
        if (!file.exists()) {
            throw new GradleException("No server log at ${file}; did runServer start?")
        }
        def text = file.text
        if (!text.contains('Done (')) {
            throw new GradleException('Server never reached the "Done (" ready line.')
        }
        def noisy = text.readLines().findAll {
            it.contains('ERROR') || it.contains('Exception in thread') || it.contains('crash-reports')
        }
        if (!noisy.isEmpty()) {
            throw new GradleException("Server log contains failures:\n" + noisy.take(20).join('\n'))
        }
    }
}

// Reproducible archives: identical bytes for identical inputs, on every OS. The
// multi-OS matrix compares the SHA-256 of all four jars, so anything that leaks a
// timestamp, a locale or a filesystem ordering into the archive fails the build.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Jar content assertions used to be a bash block with jar/grep/stat. A ZipFile
// walk is portable and gives precise failure messages.
tasks.register('verifyJar') {
    description = 'Assert the built jar contains the shipped resources and nothing dev-only.'
    group = 'verification'
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    def expectedVersion = providers.provider { project.version.toString() }
    def outputDir = layout.buildDirectory.dir('reports/jar-verification')
    outputs.dir(outputDir)
    doLast {
        def file = jarFile.get().asFile
        if (!file.exists()) {
            throw new GradleException("Jar missing: ${file}")
        }
        def entries = new java.util.zip.ZipFile(file).withCloseable { zip ->
            zip.entries().collect { it.name }
        }
        def problems = []
        if (!entries.contains('META-INF/neoforge.mods.toml')) {
            problems << 'META-INF/neoforge.mods.toml is missing'
        }
        def advancements = entries.findAll { it ==~ /data\/inf\/advancement\/.*\.json/ }
        if (advancements.size() != 19) {
            problems << "expected 19 advancements, found ${advancements.size()}"
        }
        ['assets/inf/lang/en_us.json', 'assets/inf/lang/zh_cn.json'].each {
            if (!entries.contains(it)) problems << "${it} is missing"
        }
        def devOnly = entries.findAll {
            it.startsWith('com/inf/gametest/') || it.startsWith('com/inf/clienttest/')
        }
        if (!devOnly.isEmpty()) {
            problems << "dev-only classes leaked into the jar: ${devOnly.take(5)}"
        }
        if (entries.any { it.endsWith('.bbmodel') }) {
            problems << 'BlockBench sources leaked into the jar'
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def sha = digest.digest(file.bytes).collect { String.format('%02x', it) }.join()
        def reportDir = outputDir.get().asFile
        reportDir.mkdirs()
        new File(reportDir, 'jar.txt').text = [
                "jar=${file.name}",
                "bytes=${file.length()}",
                "sha256=${sha}",
                "version=${expectedVersion.get()}"
        ].join('\n') + '\n'
        if (!problems.isEmpty()) {
            throw new GradleException("Jar verification failed:\n- " + problems.join('\n- '))
        }
        logger.lifecycle("verifyJar: ${file.name} (${file.length()} bytes) sha256=${sha}")
    }
}

tasks.register('checksums') {
    description = 'Write build/libs/SHA256SUMS.txt for the built jar.'
    group = 'verification'
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    def outFile = layout.buildDirectory.file('libs/SHA256SUMS.txt')
    outputs.file(outFile)
    doLast {
        def file = jarFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def sha = digest.digest(file.bytes).collect { String.format('%02x', it) }.join()
        def target = outFile.get().asFile
        target.parentFile.mkdirs()
        target.text = "${sha}  ${file.name}\n"
    }
}

tasks.register('balanceSim', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.inf.tools.BalanceSim'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
